<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quake III Arena · Online</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#08090b;color:#e6e6e8}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column}header{width:min(1100px,100%);margin:auto;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:16px;font-weight:650;letter-spacing:.02em;margin:0}.connection{display:flex;align-items:center;gap:8px}input,button{font:inherit;font-size:13px;border:1px solid #303137;border-radius:6px;background:#141519;color:inherit;padding:9px 12px}input{width:150px}button{cursor:pointer}button:hover{background:#24252b}button:disabled{opacity:.45;cursor:default}#btn-online{background:#b62925;border-color:#b62925;color:white}#btn-online:hover{background:#cb332e}#btn-offline{display:none}body.online #btn-offline{display:block}body.online #btn-online,body.online #player-name{display:none}main{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px 18px;gap:12px}#viewport-wrap{position:relative;width:min(1024px,100%,calc((100dvh - 150px)*1.333333));aspect-ratio:4/3;background:#000;border:1px solid #222329;border-radius:8px;overflow:hidden}#q3-canvas{display:block;width:100%;height:100%;outline:none;cursor:crosshair}#btn-fullscreen{position:absolute;right:12px;top:12px;width:38px;height:38px;padding:9px;background:#0b0c10bd;display:grid;place-items:center;z-index:20}#btn-fullscreen svg{width:19px;height:19px}#viewport-wrap:fullscreen{width:100%;height:100%;max-width:none;border:0;border-radius:0;display:flex;align-items:center;justify-content:center}#viewport-wrap:fullscreen canvas{width:min(100vw,133.333vh);height:min(100vh,75vw)}#status-overlay{position:absolute;inset:0;background:#090a0ef5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}#status-overlay.hidden{display:none}.progress-track{height:3px;width:min(240px,80%);background:#26272c}#progress-bar{height:100%;width:0;background:#bf342c}#status-text{font-size:13px;color:#c2c3c7}footer{font-size:12px;color:#8c8e97;display:flex;justify-content:space-between;gap:16px;width:min(1024px,100%)}#pointer-hint{color:#b8bac1}@media(max-width:600px){header{align-items:flex-start;flex-direction:column;padding:14px}.connection{width:100%}input{flex:1;min-width:0}main{padding:0 10px 12px}footer{flex-direction:column;gap:6px}#viewport-wrap{width:100%}}
input,select,button{min-height:38px}select{font:inherit;font-size:13px;border:1px solid #303137;border-radius:6px;background:#141519;color:inherit;padding:9px}#lobby{width:min(580px,100%)}#lobby[hidden]{display:none}#lobby h2{font-size:22px;margin:0 0 24px}.lobby-row{display:flex;gap:8px;margin:12px 0}.lobby-row input{flex:1;min-width:0}#btn-create{background:#b62925;border-color:#b62925}.section-label{font-size:12px;color:#8c8e97;margin-top:28px;text-align:left}#room-list{display:grid;gap:8px;text-align:left}#room-list button{text-align:left}#room-list p,#lobby-error{font-size:13px;color:#9b9da5}#lobby-error{color:#ef9a96}#room-code{text-transform:uppercase}#btn-copy-link,#room-label{display:none}body.online #btn-copy-link,body.online #room-label{display:block}#status-overlay.ready .progress-track,#status-overlay.ready>#status-text{display:none}@media(max-width:600px){.lobby-row{flex-wrap:wrap}#status-overlay{padding:16px}#lobby h2{font-size:18px;margin-bottom:12px}.section-label{margin-top:16px}}</style>
</head>
<body>
<header><h1>Quake III Arena</h1><div class="connection"><input id="player-name" aria-label="Oyuncu adı" placeholder="Oyuncu adı" value="Oyuncu" maxlength="24" autocomplete="nickname"><span id="room-label"></span><button id="btn-copy-link" aria-label="Davet bağlantısını kopyala" title="Davet bağlantısını kopyala"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2"/></svg></button><button id="btn-offline">Ayrıl</button></div></header>
<main>
<div id="viewport-wrap"><canvas id="q3-canvas" width="1024" height="768" tabindex="0" aria-label="Quake III oyun alanı"></canvas><button id="btn-fullscreen" aria-label="Tam ekran" title="Tam ekran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg></button><div id="status-overlay"><div class="progress-track"><div id="progress-bar"></div></div><p id="status-text">Oyun yükleniyor…</p><section id="lobby" hidden aria-label="Sunucu oluştur veya katıl"><h2>Birlikte oyna</h2><div class="lobby-row"><input id="room-name" aria-label="Sunucu adı" placeholder="Sunucu adı" maxlength="40"><select id="room-map" aria-label="Harita"><option>q3dm1</option><option>q3dm7</option><option>q3dm17</option><option>q3tourney2</option></select><button id="btn-create">Sunucu Oluştur</button></div><div class="lobby-row"><input id="room-code" aria-label="Sunucu kodu" placeholder="Sunucu kodu" maxlength="6"><button id="btn-online" disabled>Katıl</button></div><p id="room-capacity" role="status" style="font-size:12px;color:#9b9da5"></p><p class="section-label">Açık sunucular</p><div id="room-list"></div><p id="lobby-error" role="alert"></p></section></div></div>
<footer><span id="network-status" role="status">Sunucuya bağlanmaya hazırlanıyor…</span><span id="pointer-hint">Oynamak için oyun alanına tıkla · Esc ile fareyi bırak</span><a href="licenses.html" style="color:#8c8e97;font-size:11px">Demo · Lisanslar</a></footer>
</main>
<script src="pk3.js"></script><script src="network.js"></script><script src="lobby.js"></script><script src="quake3-host.js"></script>
</body></html>
