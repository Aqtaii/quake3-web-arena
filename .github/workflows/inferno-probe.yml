name: Build genuine Inferno Wingman candidate
on:
  push:
    branches: [codex/inferno-import]
    paths: [.github/workflows/inferno-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inferno-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Download pinned SteamRE downloader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools reports cs2
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-linux-x64.zip \
            -o tools/downloader.zip
          sha256sum tools/downloader.zip > reports/tool-sha256.txt
          unzip -q tools/downloader.zip -d tools/downloader
          chmod +x tools/downloader/DepotDownloader
          printf '%s\n' 'game/csgo/maps/de_inferno.vpk' 'game/csgo/gameinfo.gi' > files.txt
      - name: Request only Inferno from official Steam depot
        shell: bash
        run: |
          set -uo pipefail
          timeout 600 tools/downloader/DepotDownloader \
            -app 730 -depot 2347770 -manifest 2520908610273941189 -filelist files.txt -dir cs2 \
            -validate -max-downloads 4 2>&1 | tee reports/steam-download.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > reports/download-exit-code.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, struct
          root = pathlib.Path("cs2")
          files = []
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.name in ("de_inferno.vpk", "gameinfo.gi"):
                  sha = hashlib.sha256()
                  with p.open("rb") as f:
                      for chunk in iter(lambda: f.read(1024 * 1024), b""):
                          sha.update(chunk)
                  info = {"path": str(p), "bytes": p.stat().st_size, "sha256": sha.hexdigest()}
                  if p.suffix == ".vpk":
                      with p.open("rb") as f:
                          header = f.read(12)
                      if len(header) == 12:
                          signature, version, tree_bytes = struct.unpack("<III", header)
                          info.update(vpk_signature=hex(signature), vpk_version=version, tree_bytes=tree_bytes)
                          info["valid_vpk_header"] = signature == 0x55AA1234 and version in (1, 2)
                  files.append(info)
          report = {
              "source": "Steam content servers, app 730, depot 2347770",
              "authentication": "anonymous; no credentials supplied",
              "files": files,
              "ready_for_conversion": False,
              "note": "Acquisition probe only. Geometry, shared dependencies, collision and Wingman bounds still need conversion.",
          }
          pathlib.Path("reports/acquisition.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Official Inferno acquisition probe\n\n")
              f.write("```json\n" + json.dumps(report, indent=2) + "\n```\n")
          PY
          if [ "$result" -ne 0 ]; then
            echo "::error::Steam acquisition failed. Read steam-download.log; no map has been imported."
            exit "$result"
          fi
          test -s cs2/game/csgo/maps/de_inferno.vpk
      - name: Inspect Source 2 geometry and missing dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/ValveResourceFormat/ValveResourceFormat/releases/download/20.1/cli-linux-x64.zip \
            -o tools/viewer.zip
          echo '29d25a6d6b62377fc5386c3e5145b0a2180a401a50041afe9494b3f503deaef5  tools/viewer.zip' | sha256sum --check
          unzip -q tools/viewer.zip -d tools/viewer
          chmod +x tools/viewer/Source2Viewer-CLI
          tools/viewer/Source2Viewer-CLI --version | tee reports/viewer-version.txt
          tools/viewer/Source2Viewer-CLI -i cs2/game/csgo/maps/de_inferno.vpk --vpk_list > reports/inferno-vpk-files.txt
          mkdir -p exported
          set +e
          timeout 600 tools/viewer/Source2Viewer-CLI \
            -i cs2/game/csgo/maps/de_inferno.vpk \
            --vpk_filepath maps/de_inferno.vmap_c \
            --game cs2/game/csgo/gameinfo.gi \
            -d --gltf_export_format gltf --gltf_export_materials --gltf_export_extras \
            -o exported/ > reports/export.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > reports/export-exit-code.txt
          find exported -type f -printf '%p %s bytes\n' > reports/exported-files.txt
          if [ -f exceptions.txt ]; then cp exceptions.txt reports/; fi
          tail -n 70 reports/export.log
          python3 - <<'PY'
          import json, pathlib, os
          records = []
          for path in pathlib.Path("exported").rglob("*.gltf"):
              data = json.loads(path.read_text())
              records.append({
                  "path": str(path), "meshes": len(data.get("meshes", [])),
                  "nodes": len(data.get("nodes", [])), "materials": len(data.get("materials", [])),
                  "images": len(data.get("images", [])),
                  "extensionsRequired": data.get("extensionsRequired", []),
              })
          result = {"gltf": records, "ready_for_quake": False}
          pathlib.Path("reports/geometry.json").write_text(json.dumps(result, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n## Source 2 export diagnostics\n\n```json\n" + json.dumps(result, indent=2) + "\n```\n")
          print(json.dumps(result, indent=2))
          PY
          if [ "$result" -ne 0 ]; then
            echo "::error::Source 2 export failed; see export.log for missing dependencies or format errors."
            exit "$result"
          fi
      - name: Resolve shared official assets and audit export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p importer indexes
          for script in audit_export.py resolve_assets.py; do
            curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
              "https://raw.githubusercontent.com/Aqtaii/quake3-web-arena/e5d319444c621f45edad4afa3a136af064a98538/tools/inferno/$script" \
              -o "importer/$script"
          done
          python3 -m py_compile importer/*.py
          printf '%s\n' 'game/csgo/pak01_dir.vpk' 'game/core/pak01_dir.vpk' > index-files.txt
          timeout 300 tools/downloader/DepotDownloader \
            -app 730 -depot 2347770 -manifest 2520908610273941189 -filelist index-files.txt -dir indexes \
            -validate -max-downloads 4 > reports/index-download.log 2>&1
          for pass in 1 2 3 4; do
            cp reports/export.log "reports/export-pass-$pass.log"
            python3 importer/resolve_assets.py \
              --log "reports/export-pass-$pass.log" --indexes indexes --game cs2/game \
              --downloader tools/downloader/DepotDownloader \
              --report "reports/dependencies-$pass.json" --max-chunks 256 --batch-size 8 \
              > "reports/dependencies-$pass.log" 2>&1 || {
                tail -n 60 "reports/dependencies-$pass.log"
                exit 1
              }
            tail -n 30 "reports/dependencies-$pass.log"
            timeout 600 tools/viewer/Source2Viewer-CLI \
              -i cs2/game/csgo/maps/de_inferno.vpk \
              --vpk_filepath maps/de_inferno.vmap_c \
              --game cs2/game/csgo/gameinfo.gi \
              -d --gltf_export_format gltf --gltf_export_materials --gltf_export_extras \
              -o exported/ > reports/export.log 2>&1 || {
                tail -n 60 reports/export.log
                exit 1
              }
            if python3 importer/audit_export.py exported reports/export-audit.json reports/export.log \
                > reports/audit.log 2>&1; then
              cat reports/audit.log
              break
            fi
          done
          cat reports/audit.log
          python3 - <<'PY'
          import json, pathlib, os
          report = json.loads(pathlib.Path("reports/export-audit.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n## Final asset audit\n\n```json\n" + json.dumps(report, indent=2) + "\n```\n")
          if not report["export_integrity_passed"]:
              raise SystemExit("Incomplete export: missing assets or invalid geometry remain. See reports.")
          PY
      - name: Prepare genuine Wingman geometry and textures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p importer quake/baseq3
          for file in prepare_map.py wingman_region.py wingman-source.json region-source.json lighting-source.json textures.mjs; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/Aqtaii/quake3-web-arena/${{ github.sha }}/tools/inferno/$file" -o "importer/$file"
          done
          python3 importer/prepare_map.py exported quake/baseq3 importer > reports/preparation.log 2>&1 || { tail -n 100 reports/preparation.log; exit 1; }
          cat reports/preparation.log
          node importer/textures.mjs exported quake/baseq3/texture-jobs.json quake/baseq3 > reports/textures.log 2>&1 || { tail -n 100 reports/textures.log; exit 1; }
          tail -n 10 reports/textures.log
          cp quake/baseq3/preparation-report.json reports/
      - name: Verify and inspect maintained Quake map compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/compiler reports
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/Garux/netradiant-custom/releases/download/20260114/netradiant-custom-20260114-linux-x86_64.7z \
            -o tools/compiler.7z
          echo 'f48f6f1d0db2b910ef9cb5dc5d8a722852510f3c5c278dc17615c0466b8a7a3d  tools/compiler.7z' | sha256sum --check
          if command -v 7z >/dev/null; then extractor=7z; else extractor=7zz; fi
          "$extractor" x -y -otools/compiler tools/compiler.7z > reports/extract.log
          find tools/compiler -maxdepth 3 -type f
          python3 - <<'PY'
          import pathlib, struct
          for path in pathlib.Path("tools/compiler").rglob("*"):
              if path.is_file() and path.suffix.lower() == ".appimage":
                  data = path.read_bytes()
                  offset = data.find(b"hsqs")
                  while offset >= 0:
                      if len(data) > offset + 96 and struct.unpack_from("<H", data, offset + 28)[0] == 4:
                          pathlib.Path("tools/compiler.squashfs").write_bytes(data[offset:])
                          print("Extracted SquashFS payload without running AppImage:", path, offset)
                          break
                      offset = data.find(b"hsqs", offset + 1)
                  else:
                      raise SystemExit("No supported SquashFS filesystem found")
          PY
          if [ -f tools/compiler.squashfs ]; then
            if command -v unsquashfs >/dev/null; then
              unsquashfs -d tools/compiler/image tools/compiler.squashfs >> reports/extract.log
            else
              echo "Cloud runner has no compatible SquashFS extractor."
              exit 1
            fi
          fi
          find tools/compiler -type f -name '*q3map2*'
          compiler=$(find tools/compiler -type f \( -name q3map2 -o -name q3map2.x86_64 \) | head -n 1)
          test -n "$compiler"
          chmod +x "$compiler"
          set +e
          "$compiler" -help > reports/q3map2-help.txt 2>&1
          status=$?
          set -e
          cat reports/q3map2-help.txt
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          grep -iq 'q3map' reports/q3map2-help.txt
          command -v magick || command -v convert || true
          command -v google-chrome || command -v chromium || true
          printf '%s\n' "$compiler" > reports/compiler-path.txt
      - name: Compile original geometry into Quake BSP
        shell: bash
        run: |
          set -euo pipefail
          compiler=$(cat reports/compiler-path.txt)
          map="$PWD/quake/baseq3/maps/inferno_wingman.map"
          timeout 1800 "$compiler" -game quake3 -fs_basepath "$PWD/quake" -meta "$map" > reports/bsp.log 2>&1 || { tail -n 100 reports/bsp.log; exit 1; }
          tail -n 35 reports/bsp.log
          timeout 600 "$compiler" -game quake3 -fs_basepath "$PWD/quake" -vis -fast "$map" > reports/vis.log 2>&1 || { tail -n 100 reports/vis.log; exit 1; }
          timeout 1800 "$compiler" -game quake3 -fs_basepath "$PWD/quake" -light -fast -samples 2 "$map" > reports/light.log 2>&1 || { tail -n 100 reports/light.log; exit 1; }
          tail -n 35 reports/light.log
      - name: Validate and preserve playable-map candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, struct, json, zipfile, hashlib
          root=pathlib.Path("quake/baseq3")
          data=(root/"maps/inferno_wingman.bsp").read_bytes()
          assert data[:4]==b"IBSP" and struct.unpack_from("<I",data,4)[0]==46
          lumps=[struct.unpack_from("<II",data,8+i*8) for i in range(17)]
          assert all(o>=0 and n>=0 and o+n<=len(data) for o,n in lumps)
          off,length=lumps[13]
          assert length%104==0
          surfaces=[struct.unpack_from("<26i",data,off+i) for i in range(0,length,104)]
          assert surfaces and max(s[13] for s in surfaces)<1000, "Quake tess vertex limit"
          assert max(s[15] for s in surfaces)<6000, "Quake tess index limit"
          assert lumps[8][1]>0, "No collision brushes"
          entities=data[lumps[0][0]:sum(lumps[0])].decode()
          assert entities.count('"info_player_deathmatch"')==8
          out=pathlib.Path("candidate");out.mkdir()
          packs=[]
          groups=[[root/"maps/inferno_wingman.bsp",root/"scripts/inferno.shader"]]
          current=[];size=0
          for path in sorted((root/"textures").rglob("*")):
              if not path.is_file():continue
              if current and size+path.stat().st_size>40*1024*1024:
                  groups.append(current);current=[];size=0
              current.append(path);size+=path.stat().st_size
          if current:groups.append(current)
          for i,group in enumerate(groups):
              path=out/("inferno-map.pk3" if i==0 else "inferno-textures-%02d.pk3"%i)
              with zipfile.ZipFile(path,"w",zipfile.ZIP_DEFLATED,compresslevel=6) as z:
                  for p in group:z.write(p,p.relative_to(root).as_posix())
              packs.append({"file":path.name,"bytes":path.stat().st_size,"sha256":hashlib.sha256(path.read_bytes()).hexdigest()})
          report={"bsp_bytes":len(data),"surfaces":len(surfaces),"collision_brushes":lumps[8][1]//12,"packs":packs,"runtime_tested":False}
          (out/"candidate.json").write_text(json.dumps(report,indent=2))
          pathlib.Path("reports/candidate.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Retain compiled candidate for runtime testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inferno-compiled-candidate
          path: candidate/
          compression-level: 0
          retention-days: 3
      - name: Preserve diagnostic reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inferno-acquisition-report
          path: reports/
          if-no-files-found: warn
          retention-days: 7
